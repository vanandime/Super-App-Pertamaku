<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>Nexus Core OS v13.0 Ultimate Elite</title>
    <link rel="manifest" href="data:application/manifest+json,{
        'name':'Nexus Core OS',
        'short_name':'NexusOS',
        'start_url':'.',
        'display':'standalone',
        'background_color':'#030712',
        'theme_color':'#6366f1',
        'icons':[{'src':'https://api.dicebear.com/7.x/bottts/svg?seed=nexus','sizes':'512x512','type':'image/svg+xml'}]
    }">
    <style>
        :root {
            --bg-deep: #020617; --bg-surface: #090d16; --bg-card: #111827; --bg-hover: #1f2937;
            --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4); --border: #1e293b; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }
        [data-theme="emerald"] { --accent: #10b981; --accent-glow: rgba(16, 185, 129, 0.4); }
        [data-theme="sunset"] { --accent: #f43f5e; --accent-glow: rgba(244, 63, 94, 0.4); }
        [data-theme="obsidian"] { --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.4); --bg-deep: #000; --bg-surface: #09090b; --bg-card: #121214; }

        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; background: var(--bg-deep); color: var(--text-main); min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; align-items: center; }

        .os-container {
            width: 100%; max-width: 480px; height: 100vh; height: 100dvh;
            background: var(--bg-surface); border: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }
        @media (min-width: 500px) { .os-container { height: 92vh; border-radius: 32px; } }

        /* Loading Illusion Overlay Engine */
        #loaderOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(6px); z-index: 999;
            display: none; justify-content: center; align-items: center; flex-direction: column; gap: 12px;
            transition: opacity 0.2s ease;
        }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .os-header { padding: 16px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .os-brand h1 { font-size: 17px; margin: 0; font-weight: 800; background: linear-gradient(135deg, var(--accent), #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .os-brand span { font-size: 10px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }

        .user-pill { display: flex; align-items: center; gap: 8px; background: var(--bg-deep); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .user-pill:hover { border-color: var(--accent); }
        .user-avatar-sm { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--accent); }

        .os-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }
        .view-section { display: none; flex-direction: column; gap: 14px; animation: fadeIn 0.2s ease; }
        .view-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .search-box { position: relative; }
        .search-input { width: 100%; padding: 12px 14px 12px 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; color: var(--text-main); font-size: 13px; outline: none; }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--text-muted); }

        .category-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-pill { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 18px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .cat-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

        .module-list { display: flex; flex-direction: column; gap: 10px; }
        .module-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .module-card:hover { background: var(--bg-hover); border-color: var(--accent); transform: translateY(-2px); }
        .mod-left { display: flex; align-items: center; gap: 14px; }
        .mod-icon { width: 42px; height: 42px; background: rgba(99, 102, 241, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; fill: var(--accent); font-size: 20px; border: 1px solid var(--border); }
        .mod-info h4 { margin: 0 0 2px 0; font-size: 14px; font-weight: 700; }
        .mod-info p { margin: 0; font-size: 11px; color: var(--text-muted); }

        .btn { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 14px var(--accent-glow); }
        .btn:hover { opacity: 0.9; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); box-shadow: none; }
        .btn-outline:hover { background: var(--bg-hover); }
        .btn-danger { background: var(--danger); box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3); }

        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .form-group label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .form-control, .form-select { width: 100%; padding: 10px 12px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-size: 13px; outline: none; }
        .form-control:focus, .form-select:focus { border-color: var(--accent); }

        .os-nav { background: var(--bg-card); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)) 16px; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 9px; font-weight: 600; padding: 4px 8px; border-radius: 10px; transition: 0.2s; }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
        .nav-item.active { color: var(--accent); background: rgba(99, 102, 241, 0.1); }

        .workspace-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-surface); z-index: 100; display: none; flex-direction: column; animation: slideUp 0.2s ease; }
        .workspace-screen.active { display: flex; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .ws-header { padding: 16px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .ws-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

        .profile-banner { background: linear-gradient(135deg, var(--accent), #9333ea); padding: 22px 16px; border-radius: 18px; text-align: center; margin-bottom: 6px; box-shadow: 0 8px 20px var(--accent-glow); }
        .profile-avatar-lg { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--bg-surface); object-fit: cover; background: var(--bg-card); margin: 0 auto 8px auto; display: block; }
        .profile-stats { display: flex; justify-content: center; gap: 18px; margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.9); }
        .profile-stats div b { display: block; font-size: 15px; color: #fff; }
        .admin-badge { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.4); padding: 3px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; }
    </style>
</head>
<body>

                        <span>Edge Synced</span>

            <!-- COMMUNITY FEED -->
            <div id="socialView" class="view-section">

                </div>

    <script>

        let defaultAdmin = { username: 'admin', password: 'adminpassword', role: 'Developer', bio: 'System Administrator', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=admin', themeColor: '#6366f1', themePreset: 'midnight', lang: 'id' };

                } else {
                    appState.posts = [
                        { id: 1, author: 'admin', text: 'Nexus Core OS v13.0 Ultimate Elite online dengan arsitektur terlengkap!', time: 'Baru saja', likes: 35 }
                    ];
                }
            } catch (e) {
                console.error("Storage read quota error:", e);
            }
        }

        function saveStateToStorage() {
            try {
                localStorage.setItem('SMARTCORE_STATE', JSON.stringify({
                    currentUser: appState.currentUser,
                    following: appState.following,
                    posts: appState.posts,
                    config: appState.config
                }));
            } catch (e) {
                alert("Penyimpanan lokal penuh (QuotaExceededError). Hapus beberapa data cache.");
            }
        }

        let currentCategoryFilter = 'all';

        function withLoading(action) {
            const loader = document.getElementById('loaderOverlay');
            if (loader) loader.style.display = 'flex';
            setTimeout(() => {
                try {
                    action();
                } catch (err) {
                    console.error("Execution error:", err);
                }
                if (loader) loader.style.display = 'none';
            }, 300);
        }

        async function initOS() {
            loadStateFromStorage();

            try {
                const res = await fetch(configUrl);
                if(res.ok) {
                    const remoteConfig = await res.json();
                    if(remoteConfig && remoteConfig.categories) {
                        // Keep integrated or merge
                    }
                }
            } catch(e) {}
            
            const savedConfig = localStorage.getItem('nexus_config_override');
            if(savedConfig) { try { appState.config = JSON.parse(savedConfig); } catch(err){} }

            applyUserSettings();
            updateUIState();
            renderModules();
            renderFeed();
            renderProfileView();
            renderAdminUserList();

            const lastView = localStorage.getItem('nexus_active_view') || 'dashboardView';
            const navMap = { 'dashboardView': 0, 'socialView': 1, 'profileView': 2, 'adminView': 3 };
            const navIndex = navMap[lastView] !== undefined ? navMap[lastView] : 0;
            const navButtons = document.querySelectorAll('.os-nav .nav-item');
            if(navButtons[navIndex]) {
                switchNav(lastView, navButtons[navIndex]);
            }
        }

        function applyUserSettings() {
            const user = appState.currentUser;
            const theme = user ? (user.themePreset || 'midnight') : 'midnight';
            document.body.setAttribute('data-theme', theme);
            if(user && user.themeColor) document.documentElement.style.setProperty('--accent', user.themeColor);
        }

        function updateUIState() {
            const user = appState.currentUser;
            const avatarSm = document.getElementById('headerUserAvatar');
            const nameSm = document.getElementById('headerUserName');
            const roleText = document.getElementById('roleText');
            const adminNav = document.getElementById('adminNavBtn');

            if(user) {
                if(avatarSm) avatarSm.src = user.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.username}`;
                if(nameSm) nameSm.innerText = user.username;
                if(roleText) roleText.innerText = `Role: ${user.role}`;
                if(adminNav) adminNav.style.display = (user.role === 'Developer') ? 'flex' : 'none';
            } else {
                if(avatarSm) avatarSm.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=guest';
                if(nameSm) nameSm.innerText = 'Tamu';
                if(roleText) roleText.innerText = 'Role: Tamu';
                if(adminNav) adminNav.style.display = 'none';
            }
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(viewId);
            if(target) target.classList.add('active');
            localStorage.setItem('nexus_active_view', viewId);
        }

        function switchNav(viewId, btnEl) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(viewId);
            if(target) target.classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            localStorage.setItem('nexus_active_view', viewId);
        }

        function renderModules() {
            const container = document.getElementById('moduleContainer');
            if(!container) return;
            container.innerHTML = '';
            const searchInput = document.getElementById('searchInput');
            const query = searchInput ? searchInput.value.toLowerCase() : '';
            const categories = appState.config.categories || [];
            
            const filtered = categories.filter(mod => {
                const matchQuery = mod.name.toLowerCase().includes(query) || mod.desc.toLowerCase().includes(query);
                const matchCat = currentCategoryFilter === 'all' || mod.type === currentCategoryFilter;
                return matchQuery && matchCat;
            });

            if(filtered.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px; font-size:12px;">Modul tidak ditemukan.</div>';
                return;
            }

            filtered.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'module-card';
                card.onclick = () => withLoading(() => openWorkspace(mod));
                card.innerHTML = `
                    <div class="mod-left">
                        <div class="mod-icon">${mod.icon || '📌'}</div>
                        <div class="mod-info">
                            <h4>${mod.name} ${mod.badge ? `<span style="font-size:9px; background:var(--accent); color:#fff; padding:2px 6px; border-radius:4px; margin-left:4px; font-weight:700;">${mod.badge}</span>`:''}</h4>
                            <p>${mod.desc}</p>
                        </div>
                    </div>
                    <span style="color: var(--text-muted); font-size: 13px;">➔</span>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(type, btnEl) {
            currentCategoryFilter = type;
            document.querySelectorAll('.cat-pill').forEach(el => el.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            renderModules();
        }

        function openWorkspace(mod) {
            document.getElementById('wsTitle').innerText = mod.name;
            const body = document.getElementById('wsBodyContent');
            body.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.style.flexDirection = 'column';
            wrapper.style.gap = '10px';

            if(mod.type === 'ai') {
                const hasKey = appState.config.apiSettings?.aiKey && appState.config.apiSettings.aiKey.length > 5;
                wrapper.innerHTML = `
                    <div style="font-size:11px; color:${hasKey ? 'var(--success)' : 'var(--warning)'}; font-weight:600;">
                        ${hasKey ? '🔑 API Key Kustom Aktif & Terhubung' : '⚠️ Menggunakan Neural Simulated Core (Atur API Key di Admin Panel)'}
                    </div>
                    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:12px; height: 260px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;" id="aiChatBox">
                        <div style="background:var(--bg-hover); padding:8px 12px; border-radius:8px; font-size:12px; max-width:85%;">Halo! Nexus Neural AI siap membantu Anda.</div>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <input type="text" id="aiInput" class="form-control" placeholder="Ketik perintah AI..." onkeypress="if(event.key==='Enter') sendAIChat()">
                        <button class="btn" onclick="sendAIChat()" style="padding:8px 14px;">Kirim</button>
                    </div>
                `;
            } else if(mod.type === 'productivity') {
                wrapper.innerHTML = `
                    <div class="form-group">
                        <label>Catatan & Task Manager Pintar</label>
                        <textarea id="osNotesArea" class="form-control" style="height:180px;" placeholder="Tulis catatan..."></textarea>
                        <button class="btn" onclick="saveOSNotes()" style="margin-top:6px;">Simpan Catatan</button>
                    </div>
                `;
            } else if(mod.type === 'finance') {
                wrapper.innerHTML = `
                    <div style="background:var(--bg-card); padding:14px; border-radius:12px; border:1px solid var(--border);">
                        <h4 style="margin:0 0 8px 0; color:var(--success); font-size:13px;">Saldo Aktif: Rp 50.000.000</h4>
                        <div class="form-group"><label>Keterangan Transaksi</label><input type="text" id="finDesc" class="form-control" placeholder="Keterangan..."></div>
                        <div class="form-group"><label>Nominal (IDR)</label><input type="number" id="finNom" class="form-control" placeholder="500000"></div>
                        <button class="btn" onclick="addLedgerEntry()">Catat Keuangan</button>
                    </div>
                    <div id="ledgerLog" style="font-size:11px; color:var(--text-muted);">Belum ada mutasi baru.</div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div style="background:var(--bg-card); padding:20px; border-radius:12px; text-align:center;">
                        <h3>${mod.name}</h3>
                        <p style="color:var(--text-muted); font-size:12px;">${mod.desc}</p>
                        <div style="color:var(--success); font-weight:600; font-size:12px; margin-top:10px;">✅ Modul utilitas aktif dan berjalan optimal.</div>
                    </div>
                `;
            }
            body.appendChild(wrapper);
            if(mod.type === 'productivity') {
                const savedNote = localStorage.getItem('nexus_os_notes');
                if(savedNote) document.getElementById('osNotesArea').value = savedNote;
            }
            document.getElementById('workspaceScreen').classList.add('active');
        }

        function closeWorkspace() { document.getElementById('workspaceScreen').classList.remove('active'); }

        async function sendAIChat() {
            const input = document.getElementById('aiInput');
            const box = document.getElementById('aiChatBox');
            const val = input.value.trim();
            if(!val) return;

            box.innerHTML += `<div style="background:var(--accent); color:#fff; padding:8px 12px; border-radius:8px; font-size:12px; max-width:85%; align-self:flex-end;">${val}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            setTimeout(() => {
                box.innerHTML += `<div style="background:var(--bg-hover); padding:8px 12px; border-radius:8px; font-size:12px; max-width:85%;">Neural Core memproses query: "${val}". Berhasil!</div>`;
                box.scrollTop = box.scrollHeight;
            }, 500);
        }

        function saveOSNotes() {
            const noteText = document.getElementById('osNotesArea').value;
            localStorage.setItem('nexus_os_notes', noteText);
            alert('Catatan berhasil disimpan!');
        }

        function addLedgerEntry() {
            const desc = document.getElementById('finDesc').value;
            const nom = document.getElementById('finNom').value;
            if(!desc || !nom) return alert('Lengkapi keterangan dan nominal!');
            document.getElementById('ledgerLog').innerHTML = `<b>+ Rp ${Number(nom).toLocaleString()}</b> (${desc})`;
            alert('Transaksi berhasil dicatat!');
        }

        function renderFeed() {
            const container = document.getElementById('feedContainer');
            if(!container) return;
            container.innerHTML = '';
            appState.posts.forEach(post => {
                const isFollowing = appState.following.includes(post.author);
                const isSelf = appState.currentUser && appState.currentUser.username === post.author;
                const item = document.createElement('div');
                item.style.background = 'var(--bg-card)';
                item.style.border = '1px solid var(--border)';
                item.style.borderRadius = '12px';
                item.style.padding = '12px';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <b style="font-size:12px; color:var(--accent);">@${post.author}</b>
                            ${!isSelf ? `<button class="btn btn-outline" style="padding:2px 6px; font-size:9px;" onclick="toggleFollow('${post.author}')">${isFollowing ? 'Diikuti ✓' : '+ Ikuti'}</button>` : ''}
                        </div>
                        <span style="font-size:10px; color:var(--text-muted);">${post.time}</span>
                    </div>
                    <p style="margin:0 0 8px 0; font-size:12px;">${post.text}</p>
                    <button class="btn btn-outline" style="padding:4px 8px; font-size:10px;" onclick="likePost(${post.id})">❤️ Suka (${post.likes})</button>
                `;
                container.appendChild(item);
            });
        }

        function toggleFollow(username) {
            if(appState.following.includes(username)) {
                appState.following = appState.following.filter(u => u !== username);
            } else {
                appState.following.push(username);
            }
            saveStateToStorage();
            renderFeed();
        }

        function createPost() {
            if(!appState.currentUser) return alert('Silakan login terlebih dahulu di tab Profile!');
            const text = document.getElementById('postContentInput').value.trim();
            if(!text) return;
            appState.posts.unshift({ id: Date.now(), author: appState.currentUser.username, text: text, time: 'Baru saja', likes: 0 });
            saveStateToStorage();
            document.getElementById('postContentInput').value = '';
            renderFeed();
        }

        function likePost(id) {
            const post = appState.posts.find(p => p.id === id);
            if(post) { 
                post.likes++; 
                saveStateToStorage(); 
                renderFeed(); 
            }
        }

        function renderProfileView() {
            const container = document.getElementById('profileCardContent');
            if(!container) return;
            const user = appState.currentUser;

            if(!user) {
                container.innerHTML = `
                    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:18px;">
                        <h3 style="margin-top:0; font-size:15px;">Autentikasi & Registrasi</h3>
                        <p style="font-size:11px; color:var(--text-muted);">Admin Default: <b>admin</b> / <b>adminpassword</b></p>
                        <div class="form-group"><label>Username</label><input type="text" id="regUser" class="form-control" placeholder="Username..."></div>
                        <div class="form-group"><label>Password</label><input type="password" id="regPass" class="form-control" placeholder="Password..."></div>
                        <div style="display:flex; gap:8px; margin-top:8px;">
                            <button class="btn" style="flex:1;" onclick="withLoading(handleRegister)">Daftar</button>
                            <button class="btn btn-outline" style="flex:1;" onclick="withLoading(handleLogin)">Masuk</button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="profile-banner">
                        <img class="profile-avatar-lg" src="${user.avatar}" alt="Avatar">
                        <h2 style="margin:0; font-size:16px;">@${user.username}</h2>
                        <span style="font-size:10px; background:rgba(0,0,0,0.3); padding:2px 8px; border-radius:8px; font-weight:700;">${user.role}</span>
                        <div class="profile-stats">
                            <div><b>${appState.following.length}</b> Mengikuti</div>
                            <div><b>28</b> Pengikut</div>
                        </div>
                    </div>
                    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px;">
                        <h4 style="margin:0; font-size:13px;">Pengaturan Akun & Keamanan Profil</h4>
                        <div class="form-group"><label>Bio Singkat</label><input type="text" id="editBio" class="form-control" value="${user.bio || ''}"></div>
                        <div class="form-group"><label>URL Foto Profil (Avatar)</label><input type="text" id="editAvatar" class="form-control" value="${user.avatar || ''}"></div>
                        <div class="form-group">
                            <label>Tema Tampilan</label>
                            <select id="editThemePreset" class="form-select">
                                <option value="midnight" ${user.themePreset==='midnight'?'selected':''}>Cyber Midnight</option>
                                <option value="emerald" ${user.themePreset==='emerald'?'selected':''}>Emerald Matrix</option>
                                <option value="sunset" ${user.themePreset==='sunset'?'selected':''}>Neon Sunset</option>
                                <option value="obsidian" ${user.themePreset==='obsidian'?'selected':''}>Obsidian Dark</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Warna Aksen Kustom</label><input type="color" id="editColor" value="${user.themeColor || '#6366f1'}" style="width:100%; height:36px; background:none; border:none; cursor:pointer; border-radius:8px;"></div>
                        
                        <hr style="border:none; border-top:1px solid var(--border); margin:4px 0;">
                        <h4 style="margin:0; font-size:13px; color:var(--warning);">Keamanan & Kata Sandi</h4>
                        <div class="form-group"><label>Password Lama</label><input type="password" id="oldPass" class="form-control" placeholder="Konfirmasi sandi lama..."></div>
                        <div class="form-group"><label>Password Baru</label><input type="password" id="newPass" class="form-control" placeholder="Sandi baru (opsional)..."></div>

                        <button class="btn" onclick="withLoading(saveProfileChanges)">Simpan Perubahan & Keamanan</button>
                        <button class="btn btn-danger" onclick="withLoading(handleLogout)">Keluar Akun</button>
                    </div>
                `;
            }
        }

        function handleRegister() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value.trim();
            if(!u || !p) return alert('Isi username dan password!');
            let db = JSON.parse(localStorage.getItem('nexus_users_db') || '[]');
            if(db.find(x => x.username === u)) return alert('Username sudah terdaftar!');
            const newUser = { username: u, password: p, role: (u==='admin'||u==='developer')?'Developer':'Member', bio: 'Member aktif', avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${u}`, themeColor: '#6366f1', themePreset: 'midnight', lang: 'id' };
            db.push(newUser);
            appState.users = db;
            appState.currentUser = newUser;
            localStorage.setItem('nexus_users_db', JSON.stringify(db));
            saveStateToStorage();
            initOS();
            alert('Registrasi akun berhasil!');
        }

        function handleLogin() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value.trim();
            let db = JSON.parse(localStorage.getItem('nexus_users_db') || '[]');
            const found = db.find(x => x.username === u && x.password === p);
            if(!found) return alert('Login gagal! Gunakan admin / adminpassword');
            appState.currentUser = found;
            saveStateToStorage();
            initOS();
            alert(`Selamat datang kembali, @${found.username}!`);
        }

        function handleLogout() {
            appState.currentUser = null;
            saveStateToStorage();
            initOS();
            alert('Berhasil keluar akun.');
        }

        function saveProfileChanges() {
            if(!appState.currentUser) return;
            const oldPass = document.getElementById('oldPass').value.trim();
            const newPass = document.getElementById('newPass').value.trim();

            if (newPass) {
                if (oldPass !== appState.currentUser.password) {
                    return alert('Password lama tidak sesuai! Perubahan keamanan dibatalkan.');
                }
                appState.currentUser.password = newPass;
            }

            appState.currentUser.bio = document.getElementById('editBio').value;
            appState.currentUser.avatar = document.getElementById('editAvatar').value;
            appState.currentUser.themePreset = document.getElementById('editThemePreset').value;
            appState.currentUser.themeColor = document.getElementById('editColor').value;

            let db = JSON.parse(localStorage.getItem('nexus_users_db') || '[]');
            const idx = db.findIndex(x => x.username === appState.currentUser.username);
            if(idx !== -1) db[idx] = appState.currentUser;
            localStorage.setItem('nexus_users_db', JSON.stringify(db));
            saveStateToStorage();
            initOS();
            alert('Pengaturan profil & keamanan sandi berhasil diperbarui!');
        }

        function renderAdminUserList() {
            const listEl = document.getElementById('adminUserList');
            if(!listEl) return;
            listEl.innerHTML = '';
            let db = JSON.parse(localStorage.getItem('nexus_users_db') || '[]');
            db.forEach(u => {
                const row = document.createElement('div');
                row.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border);";
                row.innerHTML = `<span><b>@${u.username}</b> (${u.role})</span> ${u.username !== 'admin' ? `<button class="btn btn-danger" style="padding:2px 6px; font-size:9px;" onclick="adminDeleteUser('${u.username}')">Hapus</button>` : ''}`;
                listEl.appendChild(row);
            });
            const jsonEditor = document.getElementById('adminJsonEditor');
            if(jsonEditor && !jsonEditor.value) jsonEditor.value = JSON.stringify(appState.config.categories, null, 2);
            
            const apiKeyInput = document.getElementById('adminApiKey');
            if(apiKeyInput && !apiKeyInput.value) apiKeyInput.value = appState.config.apiSettings?.aiKey || '';
        }

        function adminDeleteUser(uname) {
            if(!confirm(`Hapus user @${uname}?`)) return;
            let db = JSON.parse(localStorage.getItem('nexus_users_db') || '[]');
            db = db.filter(x => x.username !== uname);
            localStorage.setItem('nexus_users_db', JSON.stringify(db));
            renderAdminUserList();
            alert('User berhasil dihapus.');
        }

        function saveAdminApiKey() {
            const key = document.getElementById('adminApiKey').value.trim();
            if(!appState.config.apiSettings) appState.config.apiSettings = {};
            appState.config.apiSettings.aiKey = key;
            saveStateToStorage();
            alert('API Key AI global berhasil diperbarui!');
        }

        function saveAdminConfig() {
            try {
                const parsed = JSON.parse(document.getElementById('adminJsonEditor').value);
                appState.config.categories = parsed;
                saveStateToStorage();
                renderModules();
                alert('Konfigurasi modul global diperbarui!');
            } catch(e) { alert('Format JSON salah!'); }
        }

        initOS();
    </script>
</body>
</html>
