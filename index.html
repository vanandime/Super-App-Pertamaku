<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Super App</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            transition: background-color 0.3s ease;
        }
        .header {
            max-width: 600px;
            margin: 0 auto 20px auto;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        h1 { font-size: 24px; margin: 0 0 5px 0; }
        #app-status { font-size: 12px; color: #888; margin: 0; }
        
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #1e1e1e; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
        }
        .category-item { 
            display: flex; 
            align-items: center; 
            padding: 15px 20px; 
            text-decoration: none; 
            color: #ffffff; 
            border-bottom: 1px solid #2a2a2a; 
            transition: background 0.2s; 
        }
        .category-item:last-child { border-bottom: none; }
        .category-item:hover { background: #2c2c2c; }
        .category-icon { font-size: 20px; margin-right: 15px; width: 30px; text-align: center; }
        .category-name { font-size: 16px; font-weight: 500; }
    </style>
</head>
<body id="app-body">

    <div class="header">
        <h1 id="app-title">Memuat Super App...</h1>
        <p id="app-status">Menghubungkan ke GitHub Gist...</p>
    </div>

    <div class="container" id="category-container">
        <!-- Konten kategori akan dimuat dinamis pada Bagian 2 -->
    </div>
