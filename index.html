<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super App Hub - Internal Ecosystem</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #101726;
            --card-hover: #192237;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --border: #1e293b;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 650px;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px 22px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .brand h1 { font-size: 20px; margin: 0; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand span { font-size: 11px; color: var(--text-secondary); display: block; margin-top: 2px; }

        .btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }

        /* Controls & Search */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        /* Container List */
        .container { 
            background: var(--card-bg); 
            border-radius: 18px; 
            overflow: hidden; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
        }

        .category-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 16px 20px; 
            cursor: pointer;
            color: var(--text-primary); 
            border-bottom: 1px solid var(--border); 
            transition: background 0.2s; 
        }
        .category-item:last-child { border-bottom: none; }
        .category-item:hover { background: var(--card-hover); }

        .category-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .category-icon { 
            width: 44px; 
            height: 44px;
            background: rgba(56, 189, 248, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            fill: var(--accent);
        }
        .category-icon svg { width: 22px; height: 22px; }

        .category-info h4 { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; }
        .category-info p { margin: 0; font-size: 12px; color: var(--text-secondary); }

        /* In-App Module Viewer (Fullscreen Overlay di Dalam Program) */
        .module-viewer {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 2000;
            flex-direction: column;
        }
        .module-viewer.active { display: flex; }

        .viewer-header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .viewer-title { font-size: 16px; font-weight: 700; margin: 0; }
        
        .viewer-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 65px);
            border: none;
            background: #fff;
        }

        .status-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <h1 id="app-title">Super App Hub</h1>
                <span>Ecosystem Dalam Program (In-App)</span>
            </div>
            <button class="btn" onclick="openDevModal()">⚙️ Dev Panel</button>
        </div>

        <!-- Search Bar -->
        <div class="controls-row">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari modul di dalam aplikasi..." oninput="filterCategories()">
            </div>
        </div>

        <!-- Category Container -->
        <div class="container" id="category-container">
            <div style="padding: 40px; text-align: center; color: var(--text-secondary);">Memuat modul...</div>
        </div>

        <div class="status-footer" id="app-status">Sistem In-App Aktif</div>
    </div>

    <!-- In-App Module Viewer Overlay -->
    <div class="module-viewer" id="moduleViewer">
        <div class="viewer-header">
            <h3 class="viewer-title" id="viewerTitle">Modul Aktif</h3>
            <button class="btn btn-outline" onclick="closeModuleViewer()">✕ Tutup / Kembali</button>
        </div>
        <iframe class="viewer-body" id="viewerIframe" src=""></iframe>
    </div>

    <!-- Developer Control Panel Modal -->
    <div class="modal" id="devModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(5px); justify-content:center; align-items:center; z-index:3000; padding:20px;">
        <div style="background:var(--card-bg); border:1px solid var(--border); width:100%; max-width:600px; padding:25px; border-radius:20px;">
            <h3>🛠️ Edit Konfigurasi Gist</h3>
            <textarea id="devJsonEditor" style="width:100%; height:250px; background:var(--bg-color); border:1px solid var(--border); border-radius:10px; color:var(--text-primary); padding:12px; font-family:monospace; font-size:13px; outline:none; resize:vertical;"></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                <button class="btn btn-outline" onclick="closeDevModal()">Tutup</button>
                <button class="btn" onclick="saveDevConfig()">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script>
        const configUrl = 'https://gist.githubusercontent.com/vanandime/0c17195c5071e6db97540e40e304ad33/raw/config.json';
        let appConfig = null;

        const iconLibrary = {
            ai: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 17.93V17a1 1 0 0 0-2 0v2.93A8.01 8.01 0 0 1 4.07 13H7a1 1 0 0 0 0-2H4.07A8.01 8.01 0 0 1 11 4.07V7a1 1 0 0 0 2 0V4.07A8.01 8.01 0 0 1 19.93 11H17a1 1 0 0 0 0 2h2.93A8.01 8.01 0 0 1 13 19.93z"/></svg>',
            default: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'
        };

        async function loadSuperApp() {
            try {
                const response = await fetch(configUrl);
                if (!response.ok) throw new Error('Gagal mengambil Gist');
                appConfig = await response.json();
                renderCategories(appConfig.categories);
                localStorage.setItem('super_app_inapp_cache', JSON.stringify(appConfig));
            } catch (e) {
                const cached = localStorage.getItem('super_app_inapp_cache');
                if (cached) {
                    appConfig = JSON.parse(cached);
                    renderCategories(appConfig.categories);
                } else {
                    document.getElementById('category-container').innerHTML = '<div style="padding:30px; text-align:center;">Gagal memuat data.</div>';
                }
            }
        }

        function renderCategories(categories) {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            categories.forEach(cat => {
                const svgIcon = iconLibrary[cat.iconKey] || iconLibrary.default;
                const div = document.createElement('div');
                div.className = 'category-item';
                div.onclick = () => openModuleInApp(cat.name, cat.link);
                div.innerHTML = `
                    <div class="category-left">
                        <div class="category-icon">${svgIcon}</div>
                        <div class="category-info">
                            <h4>${cat.name}</h4>
                            <p>${cat.desc || 'Buka modul di dalam aplikasi'}</p>
                        </div>
                    </div>
                    <span style="color:var(--accent); font-size:14px; font-weight:600;">Buka ➔</span>
                `;
                container.appendChild(div);
            });
        }

        function openModuleInApp(name, url) {
            document.getElementById('viewerTitle').innerText = name;
            document.getElementById('viewerIframe').src = url;
            document.getElementById('moduleViewer').classList.add('active');
        }

        function closeModuleViewer() {
            document.getElementById('moduleViewer').classList.remove('active');
            document.getElementById('viewerIframe').src = '';
        }

        function filterCategories() {
            if (!appConfig || !appConfig.categories) return;
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = appConfig.categories.filter(c => c.name.toLowerCase().includes(query));
            renderCategories(filtered);
        }

        function openDevModal() {
            document.getElementById('devJsonEditor').value = JSON.stringify(appConfig, null, 2);
            document.getElementById('devModal').style.display = 'flex';
        }
        function closeDevModal() { document.getElementById('devModal').style.display = 'none'; }
        
        function saveDevConfig() {
            try {
                appConfig = JSON.parse(document.getElementById('devJsonEditor').value);
                localStorage.setItem('super_app_inapp_cache', JSON.stringify(appConfig));
                renderCategories(appConfig.categories);
                closeDevModal();
                alert('Berhasil diperbarui!');
            } catch(e) { alert('JSON tidak valid!'); }
        }

        loadSuperApp();
    </script>
</body>
</html>
