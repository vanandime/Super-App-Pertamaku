<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super App Hub - Ultimate Edition</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #101726;
            --card-hover: #192237;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --border: #1e293b;
            --badge-ai: rgba(168, 85, 247, 0.15);
            --badge-ai-text: #c084fc;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 650px;
        }

        /* Header & Navbar */
        .header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px 22px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .brand h1 { font-size: 20px; margin: 0; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand span { font-size: 11px; color: var(--text-secondary); display: block; margin-top: 2px; }

        .user-menu {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        /* Category Filter Pills */
        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }
        
        .filter-pill {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-pill.active {
            background: var(--accent);
            color: #07090e;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Search Bar & Controls */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent); }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        /* Container List */
        .container { 
            background: var(--card-bg); 
            border-radius: 18px; 
            overflow: hidden; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
        }

        .category-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 16px 20px; 
            text-decoration: none; 
            color: var(--text-primary); 
            border-bottom: 1px solid var(--border); 
            transition: background 0.2s; 
        }
        .category-item:last-child { border-bottom: none; }
        .category-item:hover { background: var(--card-hover); }

        .category-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .category-icon { 
            width: 44px; 
            height: 44px;
            background: rgba(56, 189, 248, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            fill: var(--accent);
            flex-shrink: 0;
        }
        .category-icon svg { width: 22px; height: 22px; }

        .category-info h4 { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .category-info p { margin: 0; font-size: 12px; color: var(--text-secondary); }

        .tag-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--badge-ai);
            color: var(--badge-ai-text);
            font-weight: 500;
        }

        .favorite-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-secondary);
            transition: color 0.2s;
            padding: 5px;
        }
        .favorite-btn.active { color: #facc15; }

        /* Status Footer */
        .status-footer {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body id="app-body">
