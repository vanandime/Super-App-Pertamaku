<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super App Hub Ultimate</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #131c2e;
            --card-hover: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            --border: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 600px;
        }

        /* Header & Navbar */
        .header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand h1 { font-size: 20px; margin: 0; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand span { font-size: 11px; color: var(--text-secondary); }

        .user-menu {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        /* Search & Controls */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        /* Container List */
        .container { 
            background: var(--card-bg); 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); 
        }

        .category-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 16px 20px; 
            text-decoration: none; 
            color: var(--text-primary); 
            border-bottom: 1px solid var(--border); 
            transition: background 0.2s; 
        }
        .category-item:last-child { border-bottom: none; }
        .category-item:hover { background: var(--card-hover); }

        .category-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .category-icon { 
            width: 40px; 
            height: 40px;
            background: rgba(56, 189, 248, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            fill: var(--accent);
        }
        .category-icon svg { width: 22px; height: 22px; }

        .category-info h4 { margin: 0 0 3px 0; font-size: 15px; font-weight: 600; }
        .category-info p { margin: 0; font-size: 12px; color: var(--text-secondary); }

        .favorite-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-secondary);
            transition: color 0.2s;
        }
        .favorite-btn.active { color: #facc15; }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-content h3 { margin-top: 0; margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .form-control:focus { outline: none; border-color: var(--accent); }
        textarea.form-control { resize: vertical; height: 150px; font-family: monospace; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .status-footer {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body id="app-body">

    <div class="app-wrapper">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <h1 id="app-title">Super App Hub</h1>
                <span id="user-role-badge">Tamu / Pengunjung</span>
            </div>
            <div class="user-menu" id="user-menu-container">
                <!-- Dynamically rendered auth / dev buttons -->
            </div>
        </div>

        <!-- Search & Action Row -->
        <div class="controls-row">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari kategori atau modul..." oninput="filterCategories()">
            </div>
            <button class="btn btn-outline" id="devPanelBtn" style="display:none;" onclick="openDevModal()">⚙️ Dev Panel</button>
        </div>

        <!-- Category Container -->
        <div class="container" id="category-container">
            <div style="padding: 40px; text-align: center; color: var(--text-secondary);">Memuat sistem...</div>
        </div>

        <div class="status-footer" id="app-status">Menghubungkan ke GitHub Gist...</div>
    </div>

    <!-- Auth Modal (Login / Register) -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <h3 id="authModalTitle">Masuk ke Akun</h3>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="authUsername" class="form-control" placeholder="Masukkan username...">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" class="form-control" placeholder="Masukkan password...">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeAuthModal()">Batal</button>
                <button class="btn" onclick="handleAuthSubmit()">Masuk / Daftar</button>
            </div>
        </div>
    </div>

    <!-- Developer Control Panel Modal -->
    <div class="modal" id="devModal">
        <div class="modal-content" style="max-width: 600px;">
            <h3>🛠️ Developer Control Panel (Gist Config Editor)</h3>
            <div class="form-group">
                <label>Edit Konfigurasi Gist Live (JSON Format)</label>
                <textarea id="devJsonEditor" class="form-control"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeDevModal()">Tutup</button>
                <button class="btn" onclick="saveDevConfig()">Terapkan & Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const configUrl = 'https://gist.githubusercontent.com/vanandime/0c17195c5071e6db97540e40e304ad33/raw/config.json';
        let appConfig = null;
        let favorites = JSON.parse(localStorage.getItem('super_app_favs') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('super_app_user') || 'null');

        // SVG Vector Icons Library
        const iconLibrary = {
            art: '<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 20.65c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l2.69-2.69C9.93 19.76 10.93 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>',
            business: '<svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>',
            education: '<svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>',
            finance: '<svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>',
            health: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
            tools: '<svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>',
            default: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'
        };

        async function loadSuperApp() {
            try {
                const response = await fetch(configUrl);
                if (!response.ok) throw new Error('Gagal terhubung');
                appConfig = await response.json();
                
                document.getElementById('app-title').innerText = appConfig.appName || 'Super App Hub';
                document.getElementById('app-status').innerText = "🟢 Sinkronisasi Gist Aktif";
                
                renderUI();
                localStorage.setItem('super_app_config_cache', JSON.stringify(appConfig));
            } catch (error) {
                console.warn('Menggunakan cache lokal...');
                const cached = localStorage.getItem('super_app_config_cache');
                if (cached) {
                    appConfig = JSON.parse(cached);
                    document.getElementById('app-title').innerText = appConfig.appName + " (Offline)";
                    document.getElementById('app-status').innerText = "🟡 Mode Offline Aktif";
                    renderUI();
                } else {
                    document.getElementById('app-status').innerText = "🔴 Gagal Memuat Data";
                }
            }
            updateUserNavbar();
        }

        function renderUI() {
            filterCategories();
        }

        function renderCategories(categories) {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            if (!categories || categories.length === 0) {
                container.innerHTML = '<div style="padding:30px; text-align:center; color:var(--text-secondary);">Tidak ada modul/kategori ditemukan.</div>';
                return;
            }

            const sorted = [...categories].sort((a, b) => (favorites.includes(b.id) - favorites.includes(a.id)));

            sorted.forEach(cat => {
                const isFav = favorites.includes(cat.id);
                const svgIcon = iconLibrary[cat.iconKey] || iconLibrary.default;
                
                const a = document.createElement('a');
                a.href = cat.link || '#';
                a.className = 'category-item';
                a.innerHTML = `
                    <div class="category-left">
                        <div class="category-icon">${svgIcon}</div>
                        <div class="category-info">
                            <h4>${cat.name}</h4>
                            <p>${cat.desc || 'Akses modul cepat'}</p>
                        </div>
                    </div>
                    <button class="favorite-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${cat.id}')">
                        ${isFav ? '★' : '☆'}
                    </button>
                `;
                container.appendChild(a);
            });
        }

        function filterCategories() {
            if (!appConfig || !appConfig.categories) return;
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = appConfig.categories.filter(cat => 
                cat.name.toLowerCase().includes(query) || 
                (cat.desc && cat.desc.toLowerCase().includes(query))
            );
            renderCategories(filtered);
        }

        function toggleFavorite(event, id) {
            event.preventDefault();
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('super_app_favs', JSON.stringify(favorites));
            filterCategories();
        }

        // Auth System
        function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
        function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }

        function handleAuthSubmit() {
            const user = document.getElementById('authUsername').value.trim();
            if (!user) return alert('Masukkan username!');
            
            // Cek apakah user adalah dev (contoh username: "admin" atau "developer")
            const role = (user.toLowerCase() === 'admin' || user.toLowerCase() === 'developer') ? 'Developer' : 'Member';
            
            currentUser = { username: user, role: role };
            localStorage.setItem('super_app_user', JSON.stringify(currentUser));
            
            closeAuthModal();
            updateUserNavbar();
            alert(`Berhasil masuk sebagai ${role} (${user})!`);
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('super_app_user');
            updateUserNavbar();
        }

        function updateUserNavbar() {
            const container = document.getElementById('user-menu-container');
            const badge = document.getElementById('user-role-badge');
            const devBtn = document.getElementById('devPanelBtn');

            if (currentUser) {
                badge.innerText = `${currentUser.role}: ${currentUser.username}`;
                container.innerHTML = `<button class="btn btn-outline" onclick="logout()">Keluar</button>`;
                
                if (currentUser.role === 'Developer') {
                    devBtn.style.display = 'inline-flex';
                } else {
                    devBtn.style.display = 'none';
                }
            } else {
                badge.innerText = 'Tamu / Pengunjung';
                container.innerHTML = `<button class="btn" onclick="openAuthModal()">Masuk</button>`;
                devBtn.style.display = 'none';
            }
        }

        // Developer Panel System
        function openDevModal() {
            document.getElementById('devJsonEditor').value = JSON.stringify(appConfig, null, 2);
            document.getElementById('devModal').classList.add('active');
        }
        function closeDevModal() { document.getElementById('devModal').classList.remove('active'); }

        function saveDevConfig() {
            try {
                const parsed = JSON.parse(document.getElementById('devJsonEditor').value);
                appConfig = parsed;
                localStorage.setItem('super_app_config_cache', JSON.stringify(appConfig));
                renderUI();
                closeDevModal();
                alert('Konfigurasi berhasil diperbarui secara lokal!');
            } catch (e) {
                alert('Format JSON tidak valid! Periksa kembali sintaksis Anda.');
            }
        }

        loadSuperApp();
    </script>
</body>
</html>
