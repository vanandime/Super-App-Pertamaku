<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super App Hub - Native Pro Edition</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #101726;
            --card-hover: #192237;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --border: #1e293b;
            --badge-ai: rgba(168, 85, 247, 0.15);
            --badge-ai-text: #c084fc;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-wrapper { width: 100%; max-width: 650px; }

        .header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px 22px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .brand h1 { font-size: 20px; margin: 0; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand span { font-size: 11px; color: var(--text-secondary); display: block; margin-top: 2px; }

        .user-menu { display: flex; gap: 10px; align-items: center; }

        .btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }

        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }
        
        .filter-pill {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-pill.active {
            background: var(--accent);
            color: #07090e;
            border-color: var(--accent);
            font-weight: 600;
        }

        .controls-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box { position: relative; flex: 1; }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent); }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        .container { 
            background: var(--card-bg); 
            border-radius: 18px; 
            overflow: hidden; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
        }

        .category-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 16px 20px; 
            cursor: pointer;
            color: var(--text-primary); 
            border-bottom: 1px solid var(--border); 
            transition: background 0.2s; 
        }
        .category-item:last-child { border-bottom: none; }
        .category-item:hover { background: var(--card-hover); }

        .category-left { display: flex; align-items: center; gap: 16px; }

        .category-icon { 
            width: 44px; height: 44px;
            background: rgba(56, 189, 248, 0.1);
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; fill: var(--accent); flex-shrink: 0;
        }
        .category-icon svg { width: 22px; height: 22px; }

        .category-info h4 { margin: 0 0 4px 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .category-info p { margin: 0; font-size: 12px; color: var(--text-secondary); }

        .tag-badge {
            font-size: 10px; padding: 2px 8px; border-radius: 6px;
            background: var(--badge-ai); color: var(--badge-ai-text); font-weight: 500;
        }

        .favorite-btn {
            background: none; border: none; cursor: pointer; font-size: 20px;
            color: var(--text-secondary); transition: color 0.2s; padding: 5px;
        }
        .favorite-btn.active { color: #facc15; }

        /* Workspace Overlay */
        .module-viewer {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 2000; flex-direction: column;
        }
        .module-viewer.active { display: flex; }

        .viewer-header {
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
        }
        .viewer-title { font-size: 16px; font-weight: 700; margin: 0; }
        
        .viewer-body {
            flex: 1; width: 100%; height: calc(100vh - 65px);
            background: var(--bg-color); overflow-y: auto; padding: 20px;
            display: flex; justify-content: center; align-items: flex-start;
        }

        .workspace-card {
            width: 100%; max-width: 600px; background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 16px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .workspace-card h3 { margin-top: 0; color: var(--accent); }
        .workspace-card textarea, .workspace-card input {
            width: 100%; padding: 12px; background: var(--bg-color);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-primary); margin-bottom: 12px; font-size: 14px; outline: none;
        }

        /* AI Chat Box */
        .chat-box {
            height: 280px; border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg-color); padding: 15px; overflow-y: auto;
            margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;
        }
        .chat-msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; font-size: 13px; }
        .chat-msg.user { background: var(--accent); color: #07090e; align-self: flex-end; font-weight: 500; }
        .chat-msg.ai { background: var(--card-hover); color: var(--text-primary); align-self: flex-start; }

        /* Modals */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; z-index: 3000; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border);
            width: 100%; max-width: 450px; padding: 25px; border-radius: 20px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 10px 14px; background: var(--bg-color);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; outline: none;
        }

        .status-footer {
            margin-top: 18px; text-align: center; font-size: 12px; color: var(--text-secondary);
            display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="header">
            <div class="brand">
                <h1 id="app-title">Super App Hub</h1>
                <span id="user-role-badge">Tamu / Pengunjung</span>
            </div>
            <div class="user-menu" id="user-menu-container">
                <button class="btn" onclick="openAuthModal()">Masuk</button>
            </div>
        </div>

        <div class="filter-scroll">
            <div class="filter-pill active" onclick="setCategoryFilter('all', this)">Semua</div>
            <div class="filter-pill" onclick="setCategoryFilter('ai', this)">🤖 AI & LLM</div>
            <div class="filter-pill" onclick="setCategoryFilter('social', this)">💬 Sosial</div>
            <div class="filter-pill" onclick="setCategoryFilter('productivity', this)">⚡ Produktifitas</div>
            <div class="filter-pill" onclick="setCategoryFilter('finance', this)">💳 Keuangan</div>
            <div class="filter-pill" onclick="setCategoryFilter('tools', this)">🛠️ Tools</div>
        </div>

        <div class="controls-row">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari modul di dalam aplikasi..." oninput="filterCategories()">
            </div>
            <button class="btn btn-outline" id="devPanelBtn" style="display:none;" onclick="openDevModal()">⚙️ Dev Panel</button>
        </div>

        <div class="container" id="category-container">
            <div style="padding: 40px; text-align: center; color: var(--text-secondary);">Memuat modul ekosistem...</div>
        </div>

        <div class="status-footer">
            <span class="status-dot" id="status-dot"></span>
            <span id="app-status">Menghubungkan ke GitHub Gist...</span>
        </div>
    </div>

    <!-- Workspace Overlay -->
    <div class="module-viewer" id="moduleViewer">
        <div class="viewer-header">
            <h3 class="viewer-title" id="viewerTitle">Modul Aktif</h3>
            <button class="btn btn-outline" onclick="closeModuleViewer()">✕ Tutup / Kembali</button>
        </div>
        <div class="viewer-body" id="viewerBodyContent"></div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Masuk / Daftar Akun</h3>
            <div class="form-group">
                <label>Username (Ketik 'admin' untuk Dev Panel)</label>
                <input type="text" id="authUsername" class="form-control" placeholder="Masukkan username...">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" class="form-control" placeholder="Masukkan password...">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn btn-outline" onclick="closeAuthModal()">Batal</button>
                <button class="btn" onclick="handleAuthSubmit()">Masuk / Daftar</button>
            </div>
        </div>
    </div>

    <!-- Dev Modal -->
    <div class="modal" id="devModal">
        <div class="modal-content" style="max-width: 600px;">
            <h3 style="margin-top:0;">🛠️ Developer Control Panel (Gist JSON Editor)</h3>
            <div class="form-group">
                <label>Edit Konfigurasi Live JSON</label>
                <textarea id="devJsonEditor" class="form-control" style="height:250px; font-family:monospace; resize:vertical;"></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn btn-outline" onclick="closeDevModal()">Tutup</button>
                <button class="btn" onclick="saveDevConfig()">Terapkan & Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const configUrl = 'https://gist.githubusercontent.com/vanandime/0c17195c5071e6db97540e40e304ad33/raw/config.json';
        let appConfig = null;
        let currentFilter = 'all';
        let favorites = JSON.parse(localStorage.getItem('super_app_favs') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('super_app_user') || 'null');

        const iconLibrary = {
            ai: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 17.93V17a1 1 0 0 0-2 0v2.93A8.01 8.01 0 0 1 4.07 13H7a1 1 0 0 0 0-2H4.07A8.01 8.01 0 0 1 11 4.07V7a1 1 0 0 0 2 0V4.07A8.01 8.01 0 0 1 19.93 11H17a1 1 0 0 0 0 2h2.93A8.01 8.01 0 0 1 13 19.93z"/></svg>',
            social: '<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>',
            productivity: '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>',
            finance: '<svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>',
            tools: '<svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>',
            default: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'
        };

        async function loadSuperApp() {
            try {
                const response = await fetch(configUrl);
                if (!response.ok) throw new Error('Gagal mengambil Gist');
                appConfig = await response.json();
                
                document.getElementById('app-title').innerText = appConfig.appName || 'Super App Hub';
                document.getElementById('app-status').innerText = "Sinkronisasi Live Gist Aktif";
                document.getElementById('status-dot').style.background = "#22c55e";
                
                renderUI();
                localStorage.setItem('super_app_smart_cache', JSON.stringify(appConfig));
            } catch (e) {
                const cached = localStorage.getItem('super_app_smart_cache');
                if (cached) {
                    appConfig = JSON.parse(cached);
                    document.getElementById('app-title').innerText = (appConfig.appName || 'Super App Hub') + " (Offline)";
                    document.getElementById('app-status').innerText = "Mode Offline Aktif (Cache)";
                    document.getElementById('status-dot').style.background = "#eab308";
                    renderUI();
                } else {
                    document.getElementById('app-status').innerText = "Gagal memuat data.";
                    document.getElementById('status-dot').style.background = "#ef4444";
                }
            }
            updateUserNavbar();
        }

        function renderUI() { filterCategories(); }

        function setCategoryFilter(type, element) {
            currentFilter = type;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            filterCategories();
        }

        function renderCategories(categories) {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            if (!categories || categories.length === 0) {
                container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-secondary);">Tidak ada modul ditemukan pada kategori ini.</div>';
                return;
            }

            const sorted = [...categories].sort((a, b) => (favorites.includes(b.id) - favorites.includes(a.id)));

            sorted.forEach(cat => {
                const isFav = favorites.includes(cat.id);
                const svgIcon = iconLibrary[cat.iconKey] || iconLibrary.default;
                const badgeHtml = cat.badge ? `<span class="tag-badge">${cat.badge}</span>` : '';
                
                const div = document.createElement('div');
                div.className = 'category-item';
                div.onclick = () => openSmartNativeModule(cat);
                div.innerHTML = `
                    <div class="category-left">
                        <div class="category-icon">${svgIcon}</div>
                        <div class="category-info">
                            <h4>${cat.name} ${badgeHtml}</h4>
                            <p>${cat.desc || 'Buka workspace di dalam aplikasi'}</p>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button class="favorite-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${cat.id}')">
                            ${isFav ? '★' : '☆'}
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterCategories() {
            if (!appConfig || !appConfig.categories) return;
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = appConfig.categories.filter(cat => {
                const matchesQuery = cat.name.toLowerCase().includes(query) || (cat.desc && cat.desc.toLowerCase().includes(query));
                const matchesType = (currentFilter === 'all') || (cat.type === currentFilter);
                return matchesQuery && matchesType;
            });

            renderCategories(filtered);
        }

        function toggleFavorite(event, id) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('super_app_favs', JSON.stringify(favorites));
            filterCategories();
        }

        // Smart Auto-Detection Native Workspace (Otomatis Aktif Tanpa Harus Set Manual di Gist)
        function openSmartNativeModule(cat) {
            document.getElementById('viewerTitle').innerText = cat.name;
            const bodyContent = document.getElementById('viewerBodyContent');
            bodyContent.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'workspace-card';

            const nameLower = (cat.name + ' ' + (cat.type || '')).toLowerCase();

            if (nameLower.includes('ai') || nameLower.includes('chat') || nameLower.includes('gpt')) {
                wrapper.innerHTML = `
                    <h3>🤖 Asisten AI Pintar (Internal Workspace)</h3>
                    <p style="font-size:12px; color:var(--text-secondary);">Simulasi interaktif AI berjalan langsung di memori program.</p>
                    <div class="chat-box" id="chatBox">
                        <div class="chat-msg ai">Halo! Saya asisten virtual Anda. Ada yang bisa dibantu?</div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="chatInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                        <button class="btn" onclick="sendChatMessage()" style="height:42px;">Kirim</button>
                    </div>
                `;
            } else if (nameLower.includes('note') || nameLower.includes('task') || nameLower.includes('productivity')) {
                wrapper.innerHTML = `
                    <h3>📝 Catatan Pintar & Tugas Internal</h3>
                    <p style="font-size:12px; color:var(--text-secondary);">Tersimpan aman di browser Anda secara lokal.</p>
                    <textarea id="nativeNotesInput" style="height:220px;" placeholder="Tulis catatan atau daftar tugas..."></textarea>
                    <button class="btn" onclick="saveNativeNotes()">Simpan Catatan</button>
                `;
            } else if (nameLower.includes('finance') || nameLower.includes('crypto')) {
                wrapper.innerHTML = `
                    <h3>💳 Kalkulator & Pelacak Keuangan</h3>
                    <p style="font-size:12px; color:var(--text-secondary);">Simulasi pencatat pengeluaran cepat.</p>
                    <input type="text" id="finDesc" placeholder="Keterangan (Contoh: Gaji / Belanja)">
                    <input type="number" id="finNominal" placeholder="Nominal (Rp)">
                    <button class="btn" onclick="addFinanceLog()" style="margin-bottom:15px;">Tambah Catatan Keuangan</button>
                    <div id="finList" style="font-size:13px; color:var(--text-secondary);">Belum ada catatan keuangan.</div>
                `;
            } else {
                wrapper.innerHTML = `
                    <h3>🛠️ ${cat.name} Workspace</h3>
                    <p>${cat.desc || 'Modul utilitas aktif.'}</p>
                    <div style="padding: 20px; background:var(--bg-color); border-radius:10px; margin-top:15px; border:1px solid var(--border);">
                        <p style="color:var(--accent); margin:0; font-weight:600;">✅ Fitur native aktif berjalan sepenuhnya di dalam aplikasi tanpa kendala eksternal.</p>
                    </div>
                `;
            }

            bodyContent.appendChild(wrapper);

            if (nameLower.includes('note') || nameLower.includes('task') || nameLower.includes('productivity')) {
                document.getElementById('nativeNotesInput').value = localStorage.getItem('native_app_notes') || '';
            }

            document.getElementById('moduleViewer').classList.add('active');
        }

        function closeModuleViewer() {
            document.getElementById('moduleViewer').classList.remove('active');
            document.getElementById('viewerBodyContent').innerHTML = '';
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const box = document.getElementById('chatBox');
            const val = input.value.trim();
            if(!val) return;

            box.innerHTML += `<div class="chat-msg user">${val}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            setTimeout(() => {
                box.innerHTML += `<div class="chat-msg ai">Menanggapi "${val}": Sistem lokal mendeteksi permintaan Anda dan memprosesnya secara instan!</div>`;
                box.scrollTop = box.scrollHeight;
            }, 600);
        }

        function saveNativeNotes() {
            const val = document.getElementById('nativeNotesInput').value;
            localStorage.setItem('native_app_notes', val);
            alert('Catatan berhasil disimpan ke memori internal aplikasi!');
        }

        function addFinanceLog() {
            const desc = document.getElementById('finDesc').value;
            const nom = document.getElementById('finNominal').value;
            if(!desc || !nom) return alert('Isi keterangan dan nominal!');
            document.getElementById('finList').innerHTML = `<div style="padding:8px; background:var(--bg-color); border-radius:6px; margin-top:5px; color:var(--text-primary);"><b>${desc}</b>: Rp ${Number(nom).toLocaleString()}</div>`;
            alert('Catatan keuangan dicatat!');
        }

        // Auth & Dev Panel Handlers
        function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
        function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }

        function handleAuthSubmit() {
            const user = document.getElementById('authUsername').value.trim();
            if (!user) return alert('Masukkan username!');
            
            const role = (user.toLowerCase() === 'admin' || user.toLowerCase() === 'developer') ? 'Developer' : 'Member';
            currentUser = { username: user, role: role };
            localStorage.setItem('super_app_user', JSON.stringify(currentUser));
            
            closeAuthModal();
            updateUserNavbar();
            alert(`Berhasil masuk sebagai ${role} (${user})!`);
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('super_app_user');
            updateUserNavbar();
        }

        function updateUserNavbar() {
            const container = document.getElementById('user-menu-container');
            const badge = document.getElementById('user-role-badge');
            const devBtn = document.getElementById('devPanelBtn');

            if (currentUser) {
                badge.innerText = `${currentUser.role}: ${currentUser.username}`;
                container.innerHTML = `<button class="btn btn-outline" onclick="logout()">Keluar</button>`;
                if (currentUser.role === 'Developer') {
                    devBtn.style.display = 'inline-flex';
                } else {
                    devBtn.style.display = 'none';
                }
            } else {
                badge.innerText = 'Tamu / Pengunjung';
                container.innerHTML = `<button class="btn" onclick="openAuthModal()">Masuk</button>`;
                devBtn.style.display = 'none';
            }
        }

        function openDevModal() {
            document.getElementById('devJsonEditor').value = JSON.stringify(appConfig, null, 2);
            document.getElementById('devModal').classList.add('active');
        }
        function closeDevModal() { document.getElementById('devModal').classList.remove('active'); }

        function saveDevConfig() {
            try {
                appConfig = JSON.parse(document.getElementById('devJsonEditor').value);
                localStorage.setItem('super_app_smart_cache', JSON.stringify(appConfig));
                renderUI();
                closeDevModal();
                alert('Konfigurasi Gist berhasil diperbarui secara lokal!');
            } catch(e) {
                alert('Format JSON tidak valid!');
            }
        }

        loadSuperApp();
    </script>
</body>
</html>
